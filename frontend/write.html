<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>당근 클론코딩-글쓰기 페이지</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <h1>글쓰기 페이지</h1>
    <form id="write-form">
      <div>
        <label>이미지</label> <input type="file" name="image" id="image" />
      </div>
      <div>
        <label>제목</label> <input type="text" name="title" id="title" />
      </div>
      <div>
        <label>가격</label> <input type="number" name="price" id="price" />
      </div>
      <div>
        <label>설명</label>
        <input type="text" name="description" id="description" />
      </div>
      <div>
        <label>장소</label> <input type="text" name="place" id="place" />
      </div>
      <button type="submit">제출완료</button>
    </form>
    <script src="write.js"></script>
  </body>
</html>
